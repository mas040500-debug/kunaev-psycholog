<style>
.vk-hero { overflow: hidden; }

.vk-hero__inner {
  display: flex; align-items: center; gap: var(--vk-s64);
}
.vk-hero__text {
  flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start;
  gap: var(--vk-s24);
}
.vk-hero__title { font: var(--vk-display-xl); color: var(--vk-text-primary); }
.vk-hero__script {
  font: var(--vk-script-hero);
  color: var(--vk-text-accent-strong);
  /* скрипт сидит на своей базовой линии — компенсируем оптический сдвиг */
  display: inline-block;
}
.vk-hero__text .vk-btn { margin-top: var(--vk-s8); }

.vk-hero__media { flex: 0 0 auto; }

/* ---------- фото-карточка ---------- */
/* Размер из макета: padding 16, перфорация 22, gap 24 и снимок 365×488,
   то есть ровно 443×520. Ни фона, ни скругления у самой карточки нет:
   и то и другое несёт контур .vk-photo-card__bg с вырезанными дырками. */
.vk-photo-card {
  position: relative;
  width: 443px; aspect-ratio: 443 / 520;
  transform: rotate(3deg);
}
.vk-photo-card__bg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  fill: var(--vk-bg-second-soft);
}
/* Без подложки: снимок несёт собственную скруглённую маску с мягкой тенью,
   и заливка просвечивала сквозь прозрачное поле по краю голубой плашкой. */
.vk-photo-card__img {
  position: absolute; left: 14%; top: 3.1%;
  width: 82.4%; height: 93.8%;
  object-fit: cover;
}
/* подпись на «рваной» плашке */
/* Плашка 207×76 с полем 16 по кругу, повёрнутая на 3° относительно снимка —
   в макете она лежит на фотографии наискось. Поле в процентах считается от
   ширины КАРТОЧКИ: 3.612% от 443px дают ровно 16px со всех сторон. */
.vk-photo-card__plate {
  position: absolute; left: 50.2%; bottom: 4.5%; width: 46.7%;
  padding: 3.612%;
  transform: rotate(3deg);
  display: flex; flex-direction: column;
  color: var(--vk-text-on-accent);
}
.vk-photo-card__plate-bg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  fill: var(--vk-action-default);
}
.vk-photo-card__signature {
  position: relative; font: var(--vk-script-note); white-space: nowrap;
}
.vk-photo-card__caption { position: relative; font: var(--vk-body); }

/* ---------- планшет: текст над фото ---------- */
@media (max-width: 1024px) {
  .vk-hero__inner { flex-direction: column; align-items: center; gap: var(--vk-s48); }
  .vk-hero__text { align-items: flex-start; width: 100%; }
  .vk-photo-card { width: min(443px, 100%); }
}

/* ---------- мобильный ---------- */
@media (max-width: 767px) {
  .vk-hero__inner { gap: var(--vk-s32); }
  .vk-photo-card { width: 100%; transform: rotate(2deg); }
  /* Плашка сжимается вместе с карточкой, а кегль подписи — нет, и строка
     вылезала за её край: на узком экране рукописная строка мельче. */
  .vk-photo-card__signature { font-size: 18px; line-height: 16px; }
  .vk-photo-card__caption { font: var(--vk-body-sm); }
}
</style>
