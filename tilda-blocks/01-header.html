<div class="vk vk-header">
  <input type="checkbox" id="vk-nav-toggle" class="vk-header__toggle" hidden>

  <div class="vk-header__bar">
    <a class="vk-header__brand" href="#top">
      <!-- CHANGE-ME: ссылка на фото -->
      <img class="vk-header__avatar" src="photo.jpg" alt="Владимир Кунаев">
      <span class="vk-header__ident">
        <span class="vk-header__name">Владимир Кунаев</span>
        <span class="vk-header__role">ПСИХОЛОГ</span>
      </span>
    </a>

    <nav class="vk-header__nav" aria-label="Основная навигация">
      <a href="#about">Обо мне</a>
      <a href="#principles">Принципы</a>
      <a href="#education">Квалификация</a>
      <a href="#contacts">Контакты</a>
    </nav>

    <a class="vk-btn vk-header__cta" href="#contacts">Связаться со мной</a>

    <label class="vk-header__burger" for="vk-nav-toggle" aria-label="Меню">
      <span></span><span></span><span></span>
    </label>
  </div>

  <nav class="vk-header__drawer" aria-label="Мобильная навигация">
    <a href="#about">Обо мне</a>
    <a href="#principles">Принципы</a>
    <a href="#education">Квалификация</a>
    <a href="#contacts">Контакты</a>
    <a class="vk-btn vk-header__drawer-cta" href="#contacts">Связаться со мной</a>
  </nav>
</div>

<style>
.vk-header {
  background: var(--vk-bg-surface);
  border-bottom: var(--vk-bw-hairline) solid var(--vk-border-subtle);
  position: relative;
}
.vk-header__bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--vk-s24);
  padding: var(--vk-pad-element) var(--vk-margin);
}

.vk-header__brand { display: flex; align-items: center; gap: var(--vk-s16); text-decoration: none; }
.vk-header__avatar {
  width: 48px; height: 48px; flex: none;
  border-radius: var(--vk-radius-pill); object-fit: cover;
  background: var(--vk-bg-accent);
}
.vk-header__ident { display: flex; flex-direction: column; gap: var(--vk-s4); }
.vk-header__name { font: var(--vk-h4); color: var(--vk-text-primary); }
.vk-header__role { font: var(--vk-caption); color: var(--vk-text-muted); }

.vk-header__nav { display: flex; gap: var(--vk-s24); }
.vk-header__nav a {
  font: var(--vk-body); color: var(--vk-text-secondary);
  text-decoration: none; white-space: nowrap;
  transition: color .18s ease;
}
.vk-header__nav a:hover { color: var(--vk-action-default); }

/* ---------- бургер ---------- */
.vk-header__burger {
  display: none; flex-direction: column; gap: 5px;
  cursor: pointer; padding: 4px 0; flex: none;
}
.vk-header__burger span {
  width: 24px; height: 2px; border-radius: 2px;
  background: var(--vk-text-primary);
  transition: transform .2s ease, opacity .2s ease;
}
.vk-header__drawer { display: none; }

/* ---------- планшет: меню → бургер, кнопка остаётся ---------- */
@media (max-width: 1024px) {
  .vk-header__nav { display: none; }
  .vk-header__burger { display: flex; }

  .vk-header__drawer {
    display: flex; flex-direction: column; gap: var(--vk-s16);
    padding: 0 var(--vk-margin);
    max-height: 0; overflow: hidden;
    transition: max-height .28s ease, padding .28s ease;
    border-top: 0 solid var(--vk-border-subtle);
  }
  .vk-header__drawer a {
    font: var(--vk-body); color: var(--vk-text-secondary); text-decoration: none;
  }
  .vk-header__drawer a:hover { color: var(--vk-action-default); }
  .vk-header__drawer-cta { align-self: flex-start; }

  .vk-header__toggle:checked ~ .vk-header__drawer {
    max-height: 380px;
    padding: var(--vk-s24) var(--vk-margin);
    border-top-width: var(--vk-bw-hairline);
  }
  /* бургер → крестик */
  .vk-header__toggle:checked ~ .vk-header__bar .vk-header__burger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .vk-header__toggle:checked ~ .vk-header__bar .vk-header__burger span:nth-child(2) { opacity: 0; }
  .vk-header__toggle:checked ~ .vk-header__bar .vk-header__burger span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
}

/* ---------- мобильный: кнопка уезжает в шторку ---------- */
@media (max-width: 767px) {
  .vk-header__cta { display: none; }
  .vk-header__name { font: var(--vk-h4); }
  .vk-header__role { font: var(--vk-body-sm); letter-spacing: .04em; }
  .vk-header__avatar { width: 40px; height: 40px; }
}
</style>
